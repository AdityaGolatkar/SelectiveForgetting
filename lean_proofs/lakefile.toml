name = "selectiveForgetting"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SelectiveForgetting"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "SelectiveForgetting"
# Flat layout: every proof file sits directly in this folder, so the modules are
# listed explicitly rather than globbed from a subdirectory. `SelectiveForgetting`
# is the umbrella module that imports all the others.
globs = [
  "SelectiveForgetting",
  "Basic",
  "ReadoutContraction",
  "LocalForgettingBound",
  "InformationBound",
  "QuadraticScrubbing",
  "RobustScrubbing",
]
